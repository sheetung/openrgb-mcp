[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "openrgb-mcp"
version = "0.2.0"
description = "MCP server that mirrors AI session state (thinking / working / progress / done / error) onto OpenRGB hardware, using the LED count as a progress or remaining-budget bar"
readme = "README.md"
requires-python = ">=3.10"
license = "GPL-3.0-only"
license-files = ["LICENSE"]
keywords = ["mcp", "model-context-protocol", "openrgb", "rgb", "status", "led"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Hardware",
]
dependencies = [
    "mcp>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pillow>=10",
]

[project.urls]
Homepage = "https://github.com/sheetung/openrgb-mcp"
Issues = "https://github.com/sheetung/openrgb-mcp/issues"

[project.scripts]
openrgb-mcp = "openrgb_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/openrgb_mcp"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    "/tools",
    "/install",
    "/docs",
    "/README.md",
    "/CONTRACT.md",
    "/LICENSE",
    "/config.json",
]
