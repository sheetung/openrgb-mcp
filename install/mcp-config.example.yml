# DSH 中注册本 MCP server 的配置片段
#
# 用法：编辑 %USERPROFILE%\.dsh\profiles\<profile>\cordis.patch.yml，
# 在最外层数组里追加下面的条目（profile 通常是 desktop 或 web）。
#
#   - insert:
#       - id: magpie-mcp-openrgb
#         name: "@deepseek-ai/dsh-mcp-client"
#         config:
#           serverName: "openrgb"
#           transport: "stdio"
#           command: "<openrgb-mcp 可执行文件的绝对路径>"
#           toolCallTimeoutMs: 20000
#           reconnect:
#             enabled: true
#             maxAttempts: 30
#
# command 填下面任意一种（必须是绝对路径）：
#   pipx / uvx 安装： <用户目录>/.local/bin/openrgb-mcp        (Linux/macOS)
#                     C:\Users\<你>\AppData\Local\bin\openrgb-mcp.exe   (Windows)
#   仓库内 venv：     <仓库>/.venv/Scripts/openrgb-mcp.exe      (Windows)
#                     <仓库>/.venv/bin/openrgb-mcp              (Linux/macOS)
#   直接用解释器：     <仓库>/.venv/Scripts/python.exe  + args: ["<仓库>/server.py"]
#
# 保存后 DSH 会热加载，无需重启；模型侧工具名形如 mcp__openrgb__set_state。
#
# 前置条件：已安装并运行 OpenRGB，且 SDK Server 处于开启状态。
# 端口不用填：server.py 会自动发现（OPENRGB_PORT 环境变量 → OpenRGB 日志记录的端口 → 默认 6742）。
#
# 可选环境变量：
#   OPENRGB_PORT=6742   强制指定 SDK 端口
#   OPENRGB_DEVICE      按名称片段选择设备（默认第一个）
#   OPENRGB_MCP_CONFIG  指定 config.json 路径
#   OPENRGB_MCP_STATE   指定运行状态缓存路径
