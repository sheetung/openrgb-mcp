# DSH 中注册本 MCP server 的配置片段
#
# 用法：编辑 %USERPROFILE%\.dsh\profiles\<profile>\cordis.patch.yml，
# 在最外层数组里追加下面的条目（profile 通常是 desktop 或 web）。
#
#   - insert:
#       - id: magpie-mcp-openrgb
#         name: "@deepseek-ai/dsh-mcp-client"
#         config:
#           serverName: "openrgb"
#           transport: "stdio"
#           command: "<python.exe 绝对路径>"      # 任意 Python 3.10+
#           args: ["<仓库路径>/server.py"]
#           cwd: "<仓库路径>"
#           toolCallTimeoutMs: 20000
#           reconnect:
#             enabled: true
#             maxAttempts: 30
#
# 保存后 DSH 会热加载，无需重启；模型侧工具名形如 mcp__openrgb__set_state。
#
# 前置条件：已安装并运行 OpenRGB，且 SDK Server 处于开启状态。
# 端口不用填：server.py 会自动发现（OPENRGB_PORT 环境变量 → OpenRGB 日志记录的端口 → 默认 6742）。
#
# 可选环境变量：
#   OPENRGB_PORT=6742   强制指定 SDK 端口
#   OPENRGB_DEVICE      按名称片段选择设备（默认第一个）
